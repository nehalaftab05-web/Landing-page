<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Sign In</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --netflix-red: #e50914;
            --netflix-red-hover: #c40812;
            --bg-dark: #000000;
            --card-bg: rgba(0, 0, 0, 0.75);
            --input-bg: #333333;
            --input-focus-bg: #454545;
            --text-light: #ffffff;
            --text-muted: #8c8c8c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            /* Standard Netflix background image */
            background-image: url('https://assets.nflxext.com/ffe/siteui/vlv3/f841d38d-abaa-4d70-b77f-e1703f7bb733/117e3164-ab99-4a99-b9ee-7603d9ac8f94/US-en-20220502-popsignuptwoweeks-perspective_alpha_website_medium.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Semi-transparent dark vignette over the background image */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.8) 100%);
            z-index: 1;
        }

        /* --- HEADER --- */
        .header {
            position: relative;
            z-index: 10;
            height: 90px;
            padding: 0 60px;
            display: flex;
            align-items: center;
        }

        .logo svg {
            width: 167px;
            height: 45px;
        }

        /* --- MAIN LOGIN CONTAINER --- */
        .login-wrapper {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-bottom: 90px;
        }

        .login-box {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 450px;
            min-height: 660px;
            border-radius: 4px;
            padding: 60px 68px;
            display: flex;
            flex-direction: column;
        }

        .login-box h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
        }

        /* --- INTERACTIVE FLOATING LABELS --- */
        .input-group {
            position: relative;
            margin-bottom: 16px;
            width: 100%;
            height: 50px;
            background-color: var(--input-bg);
            border-radius: 4px;
        }

        .input-group input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 20px 20px 0 20px;
            color: var(--text-light);
            font-size: 16px;
            border-bottom: 2px solid transparent;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .input-group input:focus {
            background-color: var(--input-focus-bg);
        }

        .input-group label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            transition: transform 0.15s ease, font-size 0.15s ease, top 0.15s ease;
            pointer-events: none; /* Allows clicking "through" the text */
        }

        /* Trigger label transition when input is focused OR not empty */
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 7px;
            transform: translateY(0);
            font-size: 11px;
            font-weight: 700;
        }

        /* --- BUTTON & HOVER EFFECTS --- */
        .btn-signin {
            background-color: var(--netflix-red);
            color: var(--text-light);
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            margin-top: 24px;
            cursor: pointer;
            transition: background-color 0.1s ease-in-out;
        }

        .btn-signin:hover {
            background-color: var(--netflix-red-hover);
        }

        /* --- HELP & UTILITIES --- */
        .form-help {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 12px;
        }

        .remember-me {
            display: flex;
            align-items: center;
        }

        .remember-me input[type="checkbox"] {
            accent-color: var(--text-muted);
            width: 16px;
            height: 16px;
            margin-right: 5px;
            cursor: pointer;
        }

        .remember-me label {
            color: #b3b3b3;
            cursor: pointer;
        }

        .help-link {
            color: #b3b3b3;
            text-decoration: none;
        }

        .help-link:hover {
            text-decoration: underline;
        }

        /* --- EXTRA BOTTOM TEXT --- */
        .login-signup {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 16px;
        }

        .login-signup a {
            color: var(--text-light);
            text-decoration: none;
        }

        .login-signup a:hover {
            text-decoration: underline;
        }

        .recaptcha-notice {
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .recaptcha-notice a {
            color: #0071eb;
            text-decoration: none;
        }

        .recaptcha-notice a:hover {
            text-decoration: underline;
        }

        /* --- FOOTER --- */
        .footer {
            position: relative;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 30px 0;
            margin-top: auto;
            border-top: 1px solid #333;
        }

        .footer-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .footer-top {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 30px;
        }

        .footer-top a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .footer-top a:hover {
            text-decoration: underline;
        }

        .footer-links {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .footer-links a {
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 740px) {
            body {
                background-image: none; /* Fallback to solid black on mobile devices */
            }
            
            .background-overlay {
                display: none;
            }

            .header {
                height: 75px;
                padding: 0 24px;
            }

            .logo svg {
                width: 110px;
                height: 30px;
            }

            .login-box {
                background-color: var(--bg-dark);
                padding: 20px 24px;
                min-height: auto;
            }
            
            .footer {
                background-color: var(--bg-dark);
            }

            .footer-links {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <header class="header">
        <a href="#" class="logo">
            <svg viewBox="0 0 111 30" aria-hidden="true" class="svg-icon">
                <path d="M10.5 9.3L1.5 0v27.4h4.7V14.3l7.3 13.1h4.7V0h-4.7v15.2zM24.2 11.7h7.1V7h-7.1V4.7h8.4V0H19.5v27.4h13.1v-4.7h-8.4zM45.2 4.7V0H32.4v4.7h4V27.4h4.7V4.7zM51.5 0h-4.7v27.4h11.7v-4.7h-7V0zM68.7 0h-4.7v27.4h4.7V0zM83.5 0h-4.5l-5.6 13.1L67.8 0h-4.6l7.9 17.5V27.4h4.7V17.5zM102.3 0H91.1v27.4h4.7v-9.4h6.5c4 0 6.6-2.4 6.6-6.7v-4.6c0-4.3-2.6-6.7-6.6-6.7zm1.9 11.3c0 1.6-.9 2.1-2.4 2.1h-4.2V4.7h4.2c1.5 0 2.4.5 2.4 2.1v4.5z" fill="#E50914"></path>
            </svg>
        </a>
    </header>

    <main class="login-wrapper">
        <div class="login-box">
            <h1>Sign In</h1>
            
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" required placeholder=" ">
                    <label for="email">Email or mobile number</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" required placeholder=" ">
                    <label for="password">Password</label>
                </div>

                <button type="submit" class="btn-signin">Sign In</button>

                <div class="form-help">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label id="label-remember" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="help-link">Need help?</a>
                </div>
            </form>

            <div class="login-signup">
                <p>New to Netflix? <a href="#">Sign up now.</a></p>
            </div>
            
            <div class="recaptcha-notice">
                <p>This page is protected by Google reCAPTCHA to ensure you're not a bot. <a href="#">Learn more.</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p class="footer-top"><a href="#">Questions? Call 1-844-505-2993</a></p>
            <ul class="footer-links">
                <li><a href="#">FAQ</a></li>
                <li><a href="#">Help Center</a></li>
                <li><a href="#">Terms of Use</a></li>
                <li><a href="#">Privacy</a></li>
                <li><a href="#">Cookie Preferences</a></li>
                <li><a href="#">Corporate Information</a></li>
            </ul>
        </div>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // Prevent the page from refreshing when the form submits
            event.preventDefault(); 
            
            // Get the values from the input fields
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simulate a successful login pop-up
            if(email && password) {
                alert(`Simulated Login Successful!\nEmail: ${email}`);
            }
        });
    </script>
</body>
</html>
